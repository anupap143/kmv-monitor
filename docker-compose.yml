services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: kmv_network_db
      POSTGRES_USER: kmv_admin
      POSTGRES_PASSWORD: kmv_password
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kmv_admin -d kmv_network_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    environment:
      DATABASE_URL: postgresql://kmv_admin:kmv_password@db:5432/kmv_network_db
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      MAIL_ALERTS_ENABLED: ${MAIL_ALERTS_ENABLED:-false}
      MAIL_ALERT_RECIPIENTS: ${MAIL_ALERT_RECIPIENTS:-}
      MAIL_ALERT_ON_RECOVERY: ${MAIL_ALERT_ON_RECOVERY:-true}
    ports:
      - "3000:3000"
    volumes:
      - ./isp-monitor.py:/app/isp-monitor.py:ro
      - ./dashboard.html:/app/dashboard.html:ro
      - ./login.html:/app/login.html:ro
      - ./reset-password.html:/app/reset-password.html:ro
      - ./static:/app/static:ro
      - ./data:/app/data
      - ./uploads:/app/uploads
    cap_add:
      - NET_RAW # Critical for pinging from Docker
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
