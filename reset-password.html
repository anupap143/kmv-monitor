<!DOCTYPE html>
<html>
<head>
    <title>Reset Password | KMV Network Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(130deg, #05b6d6 0%, #1556d8 65%, #0f2bbf 100%);
            font-family: "Segoe UI", sans-serif;
        }
        .reset-card {
            width: min(420px, calc(100% - 32px));
            background: #fff;
            border-radius: 8px;
            padding: 32px;
            box-shadow: 0 24px 70px rgba(15, 23, 42, 0.28);
        }
        h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #0f172a;
        }
        p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .form-control {
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            padding: 11px 12px;
            margin-bottom: 14px;
        }
        .btn-primary {
            width: 100%;
            border: none;
            background: #2d9df4;
            border-radius: 20px;
            padding: 10px 14px;
            font-weight: 700;
        }
        .alert {
            display: none;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="reset-card">
        <h2>Reset Password</h2>
        <p>Enter your new password for KMV Network Monitor.</p>
        <div id="message" class="alert"></div>
        <form onsubmit="resetPassword(event)">
            <input type="password" id="newPassword" class="form-control" placeholder="New password" required>
            <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm password" required>
            <button type="submit" class="btn btn-primary">Update Password</button>
        </form>
    </div>

    <script>
        function showMessage(text, type) {
            const message = document.getElementById('message');
            message.className = `alert alert-${type}`;
            message.textContent = text;
            message.style.display = 'block';
        }

        async function resetPassword(e) {
            e.preventDefault();
            const token = new URLSearchParams(window.location.search).get('token');
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!token) {
                showMessage('Reset token is missing.', 'danger');
                return;
            }
            if (newPassword !== confirmPassword) {
                showMessage('Passwords do not match.', 'danger');
                return;
            }

            const res = await fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    token,
                    new_password: newPassword,
                    confirm_password: confirmPassword
                })
            });
            const data = await res.json();
            if (res.ok) {
                showMessage('Password updated successfully. Redirecting to login...', 'success');
                setTimeout(() => window.location.href = '/login', 1800);
            } else {
                showMessage(data.error || 'Password reset failed.', 'danger');
            }
        }
    </script>
</body>
</html>
